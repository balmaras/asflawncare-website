<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="mapTitle" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="mapTitle">Map of ASF Lawn Care's Northwest Georgia service area: Armuchee, Rome, Cartersville, Calhoun, Cedartown, Kingston, and Lindale</title>

  <defs>
    <clipPath id="roundedFrame">
      <rect x="0" y="0" width="800" height="600" rx="18" ry="18"/>
    </clipPath>
    <radialGradient id="coverageWash" cx="42%" cy="48%" r="55%">
      <stop offset="0%" stop-color="#197B52" stop-opacity="0.16"/>
      <stop offset="70%" stop-color="#197B52" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#197B52" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g clip-path="url(#roundedFrame)">
    <!-- base -->
    <rect x="0" y="0" width="800" height="600" fill="#F6F4EE"/>

    <!-- faint mow-stripe texture, matching the site's signature motif -->
    <g opacity="0.5">
      <rect x="0" y="0" width="800" height="600" fill="#F6F4EE"/>
      <g stroke="#10442C" stroke-opacity="0.035" stroke-width="46">
        <line x1="-200" y1="650" x2="650" y2="-200"/>
        <line x1="-120" y1="650" x2="730" y2="-200"/>
        <line x1="-40" y1="650" x2="810" y2="-200"/>
        <line x1="40" y1="650" x2="890" y2="-200"/>
        <line x1="120" y1="650" x2="970" y2="-200"/>
        <line x1="200" y1="650" x2="1050" y2="-200"/>
        <line x1="280" y1="650" x2="1130" y2="-200"/>
        <line x1="360" y1="650" x2="1210" y2="-200"/>
        <line x1="440" y1="650" x2="1290" y2="-200"/>
      </g>
    </g>

    <!-- soft coverage-area wash centered on Rome -->
    <ellipse cx="335" cy="305" rx="290" ry="260" fill="url(#coverageWash)"/>

    <!-- county-style outline suggestion -->
    <path d="M 85 150 Q 50 310 95 480 Q 180 560 420 540 Q 600 500 645 340 Q 655 190 520 108 Q 340 58 185 90 Q 115 105 85 150 Z"
          fill="none" stroke="#10442C" stroke-opacity="0.18" stroke-width="2.5" stroke-dasharray="2 8" stroke-linecap="round"/>

    <!-- roads connecting outer towns to the Rome hub -->
    <g fill="none" stroke="#10442C" stroke-opacity="0.38" stroke-width="3" stroke-linecap="round">
      <path d="M 335 300 Q 280 260 232 215"/>
      <path d="M 335 300 Q 310 200 292 125"/>
      <path d="M 335 300 Q 395 200 448 150"/>
      <path d="M 335 300 Q 460 290 548 275"/>
      <path d="M 335 300 Q 300 400 258 475"/>
      <path d="M 335 300 Q 290 360 254 405"/>
    </g>

    <!-- ===== Outer town pins ===== -->
    <!-- Armuchee (NW of Rome) -->
    <g transform="translate(220,205)">
      <path d="M0 -26 C13 -26 23 -16 23 -3 C23 14 0 34 0 34 C0 34 -23 14 -23 -3 C-23 -16 -13 -26 0 -26 Z" fill="#C8432B"/>
      <circle cx="0" cy="-3" r="8" fill="#F6F4EE"/>
      <text x="0" y="52" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#10442C">Armuchee</text>
    </g>

    <!-- Calhoun (N of Rome) -->
    <g transform="translate(288,112)">
      <path d="M0 -26 C13 -26 23 -16 23 -3 C23 14 0 34 0 34 C0 34 -23 14 -23 -3 C-23 -16 -13 -26 0 -26 Z" fill="#C8432B"/>
      <circle cx="0" cy="-3" r="8" fill="#F6F4EE"/>
      <text x="0" y="-36" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#10442C">Calhoun</text>
    </g>

    <!-- Kingston (NE of Rome) -->
    <g transform="translate(452,140)">
      <path d="M0 -26 C13 -26 23 -16 23 -3 C23 14 0 34 0 34 C0 34 -23 14 -23 -3 C-23 -16 -13 -26 0 -26 Z" fill="#C8432B"/>
      <circle cx="0" cy="-3" r="8" fill="#F6F4EE"/>
      <text x="0" y="-36" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#10442C">Kingston</text>
    </g>

    <!-- Cartersville (E of Rome) -->
    <g transform="translate(562,266)">
      <path d="M0 -26 C13 -26 23 -16 23 -3 C23 14 0 34 0 34 C0 34 -23 14 -23 -3 C-23 -16 -13 -26 0 -26 Z" fill="#C8432B"/>
      <circle cx="0" cy="-3" r="8" fill="#F6F4EE"/>
      <text x="0" y="52" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#10442C">Cartersville</text>
    </g>

    <!-- Lindale (just S of Rome) -->
    <g transform="translate(248,410)">
      <path d="M0 -26 C13 -26 23 -16 23 -3 C23 14 0 34 0 34 C0 34 -23 14 -23 -3 C-23 -16 -13 -26 0 -26 Z" fill="#C8432B"/>
      <circle cx="0" cy="-3" r="8" fill="#F6F4EE"/>
      <text x="0" y="52" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#10442C">Lindale</text>
    </g>

    <!-- Cedartown (S of Rome) -->
    <g transform="translate(252,490)">
      <path d="M0 -26 C13 -26 23 -16 23 -3 C23 14 0 34 0 34 C0 34 -23 14 -23 -3 C-23 -16 -13 -26 0 -26 Z" fill="#C8432B"/>
      <circle cx="0" cy="-3" r="8" fill="#F6F4EE"/>
      <text x="0" y="52" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#10442C">Cedartown</text>
    </g>

    <!-- ===== Rome — home base, drawn last so it sits on top ===== -->
    <g transform="translate(335,300)">
      <circle r="38" fill="#10442C"/>
      <circle r="38" fill="none" stroke="#C8432B" stroke-width="3"/>
      <path d="M0 -14 L11 -4 L11 13 L4 13 L4 3 L-4 3 L-4 13 L-11 13 L-11 -4 Z" fill="#F6F4EE"/>
      <text x="0" y="60" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#10442C">Rome</text>
      <text x="56" y="4" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#C8432B" letter-spacing="0.5">HOME BASE</text>
    </g>

    <!-- compass rose -->
    <g transform="translate(730,70)" opacity="0.55">
      <circle r="28" fill="none" stroke="#10442C" stroke-width="1.5"/>
      <path d="M0 -22 L6 0 L0 22 L-6 0 Z" fill="#10442C"/>
      <text x="0" y="-34" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#10442C">N</text>
    </g>

    <!-- caption -->
    <text x="40" y="565" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="600" fill="#10442C" opacity="0.55" letter-spacing="0.5">NORTHWEST GEORGIA</text>
  </g>
</svg>
